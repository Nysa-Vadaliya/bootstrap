<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <!--part 3 : nav bar-->
<nav class="navbar navbar-expand-sm justify-content-center"> <!--creates a navbar that expands on small screens and centers the navigation links-->
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" href="https://www.amazon.com">Amazon</a> 
    </li>
    <li class="nav-item">
      <a class="nav-link" href="https://www.tacobell.com">Taco Bell</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="https://www.apple.com">Apple </a>
    </li>
  </ul>
</nav>

  <!--PART 1-->

  <div class="row"><!-- creates a horizontal row to hold  the columns-->
    <div class="col-sm-3" style="background: linear-gradient(to right, rgb(224, 74, 44), rgb(228, 171, 79)); padding: 2rem;">column 1</div>
    <div class="col-sm-3" style="background: linear-gradient(to right, rgb(228, 171, 79), rgb(238, 238, 59)); padding: 2rem;">column 2</div>
    <div class="col-sm-3" style="background: linear-gradient(to right, rgb(238, 238, 59), rgb(116, 218, 116)); padding: 2rem;">column 3</div>
    <div class="col-sm-3" style="background: linear-gradient(to right, rgb(116, 218, 116), rgb(46, 46, 248)); padding: 2rem;">column 4</div>
  </div>
  



 
<!-- Part 2: Carousel -->
<div class="d-flex justify-content-center my-5">
  <div id="demo" class="carousel slide" data-bs-ride="carousel" style="max-width: 800px; width: 100%;">

    <!-- indicators/dots -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
    </div>

    <!-- The slideshow/carousel that holds the images -->
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="tacobell.png" alt="Taco Bell" class="d-block w-100" style="height: 140vh;">
      </div>
      <div class="carousel-item">
        <img src="iphone.jpeg" alt="Chipotle" class="d-block w-100" style="height: 140vh;">
      </div>
      <div class="carousel-item">
        <img src="amazon.jpeg" alt="Tiktok" class="d-block w-100" style="height: 140vh;">
      </div>
    </div>

    <!-- left and right arrow controls/icons -->
    <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</div>
<!--part 4-->

<div class="container mt-3">
  <div class="row">
    <div class="col-md-6"> <!-- splits into 6 since there are 2 columns -->
      <div class="card" style="width: 100%; height: 100%">
        <img class="card-img-top" src="tacobellfounder.jpeg" style="width:100%; height: 80%">
        <div class="card-body">
          <h4 class="card-title">Glen Powell</h4>
          <p class="card-text">This is the Taco Bell founder</p> 
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card" style="width: 100%; height: 100%">
        <img class="card-img-top" src="jeffbezos.jpeg" style="width:100%; height: 80%">
        <div class="card-body">
          <h4 class="card-title">Jeff Bezos</h4>
          <p class="card-text">This is the CEO of Amazon</p>
        </div>
      </div>
    </div>
  </div>
</div>

 
</body>
