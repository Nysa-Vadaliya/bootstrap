<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <!--PART 1-->


  <div class="container-fluid mt-3">
    <h1>Responsive Columns</h1>
    <div class="row">
      <div class="p-3 bg-primary text-white text-center rounded column-content w-20 d-block">FIRST</div>
      <div class="p-3 bg-secondary text-white text-center rounded column-content w-20 d-block">SECOND</div>
      <div class="p-3 bg-success text-white text-center rounded column-content w-20 d-block">THIRD</div>
      <div class="p-3 bg-danger text-white text-center rounded column-content w-20 d-block">FOURTH</div>
    </div>
    </div>



 
      <!--PART 2-->
      <div class="d-flex justify-content-center mt-5">
        <div id="mainImageCarousel" class="carousel slide w-75" data-bs-ride="carousel" style="max-width: 600px;">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#mainImageCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#mainImageCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#mainImageCarousel" data-bs-slide-to="2"></button>
          </div>
          <div class="carousel_inner">
            <div class="carousel-item active carousel-slide">
              <img src="tacobell.png" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item carousel-slide">
              <img src="CHIPTLE.JPEG" class="d-block w-100" alt="Slide 2">
            </div>
            <div class="carousel-item carousel-slide">
              <img src="tiktock.png" class="d-block w-100" alt="Slide 3">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#ImageCarousel" data-bs-slide="previousone">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#ImageCarousel" data-bs-slide="nextone">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>
</body>
</html>
